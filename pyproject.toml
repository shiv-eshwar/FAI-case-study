[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-ai-case-study"
version = "1.0.0"
description = "Bounded prioritized multi-robot planning with independent safety validation"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]
documents = ["python-docx>=1.1", "python-pptx>=1.0", "reportlab>=4", "pypdf>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
